name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test --grep @ui

      - name: Restore Allure history from last published report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p allure-report/history
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -fsSL "$base/$f" -o "allure-report/history/$f" || rm -f "allure-report/history/$f"
          done

      - name: Write Allure executor info
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p allure-results
          jq -n \
            --arg order "$RUN_NUMBER" \
            --arg run "$RUN_URL" \
            --arg report "$REPORT_URL" \
            '{name: "GitHub Actions", type: "github", reportName: ("Saucedemo tests #" + $order), buildOrder: ($order | tonumber), buildName: ("CI #" + $order), buildUrl: $run, reportUrl: $report}' \
            > allure-results/executor.json

      - run: npm run allure:generate
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
